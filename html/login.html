<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    
    <title>Login - Chalochale Travel</title>

     <script src="https://kit.fontawesome.com/c9da710483.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Navbar Start -->
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                    <div class="container-fluid">
                        <a class="navbar-brand fw-bold" href="index.html">
                            <i class="fa-solid fa-plane-departure"></i> Chalochale Travel
                        </a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarNav">
                            <ul class="navbar-nav ms-auto">
                                <li class="nav-item">
                                    <a class="nav-link" href="index.html">Home</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="destination.html">Destination</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="packages.html">Packages</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="contact.html">Contact</a>
                                </li>
                            </ul>
                            <a href="signup.html" class="btn btn-warning ms-lg-3">Sign Up</a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </div>
    <!-- Navbar End -->

    <!-- Login Section Start -->
    <section class="py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="card shadow-sm">
                        <div class="card-body p-5">
                            <h2 class="card-title text-center mb-2">Welcome Back</h2>
                            <p class="text-center text-muted mb-4">Login to your Chalochale Travel account</p>

                            <form id="loginForm" method="POST">
                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                                </div>

                                <!-- Password -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                                </div>

                                <!-- Remember Me & Forgot Password -->
                                <div class="mb-3 d-flex justify-content-between align-items-center">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
                                        <label class="form-check-label" for="rememberMe">
                                            Remember me
                                        </label>
                                    </div>
                                    <a href="#" class="text-decoration-none">Forgot password?</a>
                                </div>

                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-warning w-100 fw-bold mb-3">Login</button>

                                <!-- Sign Up Link -->
                                <p class="text-center">
                                    Don't have an account? <a href="signup.html" class="text-decoration-none">Sign up here</a>
                                </p>
                            </form>

                            <!-- Social Login Options -->
                            <div class="mt-4 pt-3 border-top">
                                <p class="text-center text-muted small mb-3">Or login with</p>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-outline-dark flex-grow-1" type="button">
                                        <i class="fab fa-google"></i> Google
                                    </button>
                                    <button class="btn btn-outline-dark flex-grow-1" type="button">
                                        <i class="fab fa-facebook"></i> Facebook
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Login Section End -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <script>
        // Basic form validation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please fill in all fields');
                return false;
            }

            alert('Login successful! Welcome to Chalochale Travel.');
            // Here you would typically send the credentials to your backend
        });
    </script>
</body>
</html>
